<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Painel · KKona404</title>
  <meta name="theme-color" content="#08070b">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/loja.css">
  <link rel="stylesheet" href="css/admin.css">
  <script type="module" src="js/admin.js"></script>
</head>
<body class="admin">
  <!-- Login -->
  <main class="login" id="tela-login">
    <form class="login-caixa" id="form-login">
      <div class="logo">KKONA<span>404</span></div>
      <h1>Painel do produtor</h1>
      <label class="campo"><span>Senha do painel</span><input type="password" id="senha" autocomplete="current-password" required></label>
      <button class="btn btn-roxo btn-largo" type="submit" id="btn-entrar">Entrar</button>
      <a class="voltar" href="./">← Voltar para a loja</a>
    </form>
  </main>

  <!-- Painel -->
  <div class="hidden" id="tela-painel">
    <header class="nav">
      <div class="nav-in">
        <div class="logo">KKONA<span>404</span> <small class="painel-tag">painel</small></div>
        <div class="nav-acoes">
          <a class="btn btn-contorno btn-p" href="./" target="_blank" rel="noopener">Ver loja</a>
          <button class="btn btn-contorno btn-p" type="button" id="btn-sair">Sair</button>
        </div>
      </div>
    </header>

    <main class="painel">
      <div class="resumo" id="resumo"></div>

      <div class="abas" role="tablist" aria-label="Seções do painel">
        <button type="button" role="tab" data-aba="pedidos" aria-selected="true">Pedidos</button>
        <button type="button" role="tab" data-aba="beats" aria-selected="false">Beats</button>
        <button type="button" role="tab" data-aba="config" aria-selected="false">Configurações</button>
      </div>

      <section class="aba" id="aba-pedidos" role="tabpanel">
        <div class="aba-barra">
          <label class="filtro"><span>Status</span>
            <select id="f-status">
              <option value="">Todos</option>
              <option value="novo">Novos</option>
              <option value="em andamento">Em andamento</option>
              <option value="concluido">Concluídos</option>
              <option value="cancelado">Cancelados</option>
            </select>
          </label>
          <button class="btn btn-contorno btn-p" type="button" id="btn-recarregar">Atualizar</button>
        </div>
        <div class="lista" id="lista-pedidos"></div>
      </section>

      <section class="aba hidden" id="aba-beats" role="tabpanel">
        <div class="aba-barra">
          <p class="ajuda">Beats escondidos não aparecem na loja. Ordem menor aparece primeiro.</p>
          <button class="btn btn-roxo btn-p" type="button" id="btn-novo-beat">+ Novo beat</button>
        </div>
        <div class="lista" id="lista-beats"></div>
      </section>

      <section class="aba hidden" id="aba-config" role="tabpanel">
        <form class="cartao config" id="form-config">
          <label class="checa"><input type="checkbox" id="c-promo-ativa"> Mostrar faixa de promoção no topo da loja</label>
          <label class="campo"><span>Texto da promoção</span><input id="c-promo-texto" maxlength="140"></label>
          <label class="campo"><span>WhatsApp que recebe os pedidos (só números, com 55 e DDD)</span><input id="c-whats" inputmode="numeric" maxlength="20" required></label>
          <button class="btn btn-roxo" type="submit">Salvar configurações</button>
        </form>
      </section>
    </main>
  </div>

  <!-- Formulário de beat -->
  <dialog class="janela janela-larga" id="dlg-beat" aria-labelledby="t-beat">
    <form class="janela-corpo" id="form-beat" novalidate>
      <header class="janela-topo">
        <h2 id="t-beat">Novo beat</h2>
        <button class="fechar" type="button" data-fechar aria-label="Fechar">×</button>
      </header>
      <div class="grade-2">
        <label class="campo"><span>Título *</span><input id="b-titulo" maxlength="80" required></label>
        <label class="campo"><span>Gênero</span><input id="b-genero" maxlength="40" list="generos"></label>
        <label class="campo"><span>BPM</span><input id="b-bpm" type="number" min="40" max="300" value="140"></label>
        <label class="campo"><span>Tom</span><input id="b-tom" maxlength="30" placeholder="Ex.: G# Major"></label>
        <label class="campo"><span>Preço beat completo (R$)</span><input id="b-preco-base" inputmode="decimal" value="40"></label>
        <label class="campo"><span>Preço “de” (riscado, opcional)</span><input id="b-preco-base-antigo" inputmode="decimal" value="50"></label>
        <label class="campo"><span>Preço beat + stems (R$)</span><input id="b-preco-stems" inputmode="decimal" value="60"></label>
        <label class="campo"><span>Preço “de” stems (opcional)</span><input id="b-preco-stems-antigo" inputmode="decimal" value="75"></label>
      </div>

      <div class="arquivo">
        <span class="arquivo-rotulo">Capa</span>
        <div class="arquivo-linha">
          <img id="b-capa-previa" alt="" class="previa-capa">
          <div class="arquivo-campos">
            <input id="b-capa" placeholder="assets/img/... ou https://..." maxlength="600">
            <label class="btn btn-contorno btn-p">Enviar imagem<input type="file" accept="image/jpeg,image/png,image/webp" id="b-capa-arquivo" hidden></label>
          </div>
        </div>
      </div>
      <div class="arquivo">
        <span class="arquivo-rotulo">Áudio * (prévia em MP3, até 5,5 MB)</span>
        <div class="arquivo-campos">
          <input id="b-audio" placeholder="assets/audio/... ou https://..." maxlength="600">
          <label class="btn btn-contorno btn-p">Enviar áudio<input type="file" accept="audio/mpeg,audio/wav,audio/ogg" id="b-audio-arquivo" hidden></label>
        </div>
        <audio id="b-audio-previa" controls preload="none"></audio>
      </div>

      <div class="grade-2">
        <label class="campo"><span>Ordem</span><input id="b-ordem" type="number" value="0"></label>
        <label class="checa"><input type="checkbox" id="b-ativo" checked> Mostrar na loja</label>
      </div>
      <button class="btn btn-roxo btn-largo" type="submit" id="btn-salvar-beat">Salvar beat</button>
    </form>
  </dialog>
  <datalist id="generos"></datalist>

  <div class="avisos" id="avisos" popover="manual" aria-live="assertive"></div>
</body>
</html>
